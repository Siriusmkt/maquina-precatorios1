[project]
name = "maquina-api"
version = "0.1.0"
description = "API e workers da Maquina de Prospeccao de Precatorios"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.7",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-q --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF", "PL", "ASYNC", "DTZ", "PT", "RET", "ARG", "BLE"]
ignore = [
  "PLR0913",  # funcoes de fabrica de teste com muitos parametros nomeados
  "PLR2004",  # numeros magicos em asserts de teste
  "RUF001", "RUF002", "RUF003",  # texto em portugues com acentos
  "N818",  # nomes de excecao em portugues (ErroApi, TokenInvalido) em vez do sufixo Error
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "PLR0915", "ARG001"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
