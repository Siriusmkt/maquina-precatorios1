# Producao/homologacao (Easypanel ou qualquer Docker). O Postgres e o Auth
# sao os do Supabase (self-hosted); aqui sobem API, front+proxy e Redis.
# Segredos vem do arquivo .env (copie de .env.exemplo; NUNCA versione o .env).

x-endurecido: &endurecido
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  api:
    <<: *endurecido
    build: ./backend
    env_file: .env
    environment:
      MAQUINA_AMBIENTE: producao
      MAQUINA_REDIS_URL: redis://:${REDIS_SENHA:?defina REDIS_SENHA}@redis:6379/0
    tmpfs: ["/tmp:uid=10001,gid=10001"]
    depends_on:
      redis: { condition: service_healthy }
    networks: [interna]

  web:
    <<: *endurecido
    build: ./frontend
    environment:
      API_UPSTREAM: api:8000
      PROXY_CONFIAVEL: ${PROXY_CONFIAVEL:-10.0.0.0/8}
    # O template do nginx e renderizado no start: essas pastas precisam ser gravaveis (uid 101 = nginx).
    tmpfs: ["/tmp:uid=101,gid=101", "/var/cache/nginx:uid=101,gid=101", "/etc/nginx/conf.d:uid=101,gid=101"]
    ports: ["${PORTA_WEB:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    networks: [interna]

  redis:
    <<: *endurecido
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_SENHA}", "--save", "", "--appendonly", "no",
              "--rename-command", "FLUSHALL", "", "--rename-command", "CONFIG", "", "--maxmemory", "256mb",
              "--maxmemory-policy", "volatile-ttl"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_SENHA\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      retries: 5
    environment:
      REDIS_SENHA: ${REDIS_SENHA}
    tmpfs: [/data]
    networks: [interna]

networks:
  interna: {}
